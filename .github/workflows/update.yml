name: Update Rhine monitor

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:          # "Run workflow" button for a manual update
  push:
    branches: [main]
    paths: ["*.py", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  contents: write   # commit the archive
  pages: write      # publish the site
  id-token: write

concurrency:
  group: rhine-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch data and archive forecasts/observations
        run: python update.py

      - name: Build site
        run: python build_site.py

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add data 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Archive $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
